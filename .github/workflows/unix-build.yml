name: Linux and macOS installers
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-26.04
            arch: x64
          - target: macos
            runner: macos-15
            arch: arm64
          - target: macos
            runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aa4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
          architecture: ${{ matrix.arch }}
      - name: Install Linux packaging and Qt prerequisites on this runner
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev libgl1 libegl1 libx11-xcb1 libxcb-cursor0 +            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1
      - name: Prepare isolated build environment
        run: |
          python -m venv .venv-build
          bash build_tools/common/prepare_unix.sh .venv-build/bin/python
      - name: Compile, smoke-test and package
        run: .venv-build/bin/python scripts/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: APEPDFStudio-development-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
