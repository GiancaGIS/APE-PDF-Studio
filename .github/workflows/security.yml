name: Security regression
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .venv-build
          ./scripts/build_patched_mupdf.ps1 -PythonExe .venv-build/Scripts/python.exe
          .venv-build/Scripts/python -m pip install --find-links .dev-deps/patched-wheels -r requirements-release.txt -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build_windows_sandbox.ps1
          .venv-build/Scripts/python scripts/prepare_sandbox_runtime.py
      - name: Windows isolation probes
        run: .venv-build/Scripts/python scripts/test_windows_sandbox.py
      - name: Regression and hostile protocol cases
        run: .venv-build/Scripts/python -m pytest -q -p no:cacheprovider --basetemp build/pytest-security --junitxml=build/pytest-results.xml --durations=15
      - name: Protocol mutation smoke
        run: .venv-build/Scripts/python scripts/fuzz_security_protocol.py --cases 10000
      - name: Native parser mutation smoke in AppContainer
        run: .venv-build/Scripts/python scripts/fuzz_native_pdf.py --cases 12 --budget 120
      - name: Dependency advisory audit
        if: always()
        shell: pwsh
        run: |
          python -m pip install pip-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-build/Scripts/python -c "from pathlib import Path; Path('build').mkdir(exist_ok=True); Path('build/audit-requirements.txt').write_text(Path('requirements-release.txt').read_text().replace('pymupdf==1.28.2.post1285','pymupdf==1.28.2'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit -r build/audit-requirements.txt --no-deps --disable-pip -f json -o build/pip-audit.json
          $dependencyAuditExit = $LASTEXITCODE
          if (Test-Path -LiteralPath build/pip-audit.json) {
            $dependencyAuditReport = Get-Content -LiteralPath build/pip-audit.json -Raw | ConvertFrom-Json
            foreach ($dependency in $dependencyAuditReport.dependencies) {
              foreach ($vulnerability in $dependency.vulns) {
                $fixedVersions = $vulnerability.fix_versions -join ', '
                if (-not $fixedVersions) { $fixedVersions = 'no fixed version reported' }
                Write-Host "$($dependency.name) $($dependency.version): $($vulnerability.id) | fix: $fixedVersions"
              }
            }
          }
          exit $dependencyAuditExit
      - name: Native inventory and official advisories
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv-build/Scripts/python scripts/security_inventory.py --upstream --output build/security-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: |
            build/pytest-results.xml
            build/pip-audit.json
            build/security-inventory.json
            build/windows/native-fuzz.json
          retention-days: 30
