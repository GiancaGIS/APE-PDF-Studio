    <ellipse cx="1110" cy="160" rx="400" ry="400" fill="url(#glow)"/>
    <g fill="none" stroke="#79d1d0" stroke-opacity="0.08">
      <circle cx="1070" cy="170" r="150"/><circle cx="1070" cy="170" r="210"/><circle cx="1070" cy="170" r="270"/>
