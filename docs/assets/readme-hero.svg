      <rect x="826" y="173" width="151" height="8" rx="4" fill="#d4e2ee"/>
      <rect x="826" y="195" width="176" height="8" rx="4" fill="#d4e2ee"/>
      <rect x="826" y="217" width="127" height="8" rx="4" fill="#d4e2ee"/>
      <rect x="825" y="251" width="178" height="38" rx="9" fill="#def4f1"/>
      <path d="m840 270 5 5 10-11" fill="none" stroke="#239a91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="867" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#23796f">Searchable text</text>
