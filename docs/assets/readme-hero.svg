    </g>
    <rect width="7" height="360" fill="#2bb6be"/>
    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <text x="58" y="65" fill="#79dbd7" font-size="13" font-weight="700" letter-spacing="2.4">BUILT FOR YOUR DESKTOP</text>
      <text x="54" y="135" fill="#ffffff" font-size="58" font-weight="700">Read. Edit.</text>
      <text x="54" y="200" fill="#ffffff" font-size="58" font-weight="700">Make it searchable.</text>
      <text x="58" y="242" fill="#b6cbdf" font-size="19">A clear view. Local OCR. Flexible exports.</text>
      <rect x="57" y="282" width="166" height="31" rx="15.5" fill="#264963" stroke="#4c728d" stroke-opacity="0.6"/>
      <text x="140" y="302" text-anchor="middle" fill="#e3f3ff" font-size="10.5" font-weight="700" letter-spacing="0.6">LOCAL PROCESSING</text>
      <rect x="235" y="282" width="153" height="31" rx="15.5" fill="#264963" stroke="#4c728d" stroke-opacity="0.6"/>
      <text x="311.5" y="302" text-anchor="middle" fill="#e3f3ff" font-size="10.5" font-weight="700" letter-spacing="0.6">4 UI LANGUAGES</text>
      <rect x="400" y="282" width="197" height="31" rx="15.5" fill="#1d5968" stroke="#46918f" stroke-opacity="0.6"/>
      <text x="498.5" y="302" text-anchor="middle" fill="#c4fcf2" font-size="10.5" font-weight="700" letter-spacing="0.6">ITALIAN + ENGLISH OCR</text>
