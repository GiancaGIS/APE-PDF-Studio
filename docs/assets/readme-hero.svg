      <rect x="997" y="124" width="120" height="7" rx="3.5" fill="#89aac1"/>
      <rect x="997" y="143" width="137" height="7" rx="3.5" fill="#89aac1"/>
      <rect x="997" y="179" width="137" height="82" rx="9" fill="#7fb6c4"/>
