<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">APE PDF Studio — Read. Edit. Make it searchable.</title>
  <desc id="description">A navy and turquoise banner with overlapping document cards and the APE PDF Studio document-and-bee icon. Local processing, four interface languages, Italian and English OCR.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101e35"/><stop offset="0.55" stop-color="#163758"/><stop offset="1" stop-color="#15586a"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#31b8bd" stop-opacity="0.22"/><stop offset="1" stop-color="#31b8bd" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="32" y1="16" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4486c4"/><stop offset="0.52" stop-color="#386ea8"/><stop offset="1" stop-color="#214a7b"/>
    </linearGradient>
    <linearGradient id="paper" x1="144" y1="80" x2="360" y2="428" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f6fc"/></linearGradient>
    <linearGradient id="ascent" x1="252" y1="174" x2="338" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#24b6bf"/><stop offset="1" stop-color="#2395ad"/></linearGradient>
    <clipPath id="bannerClip"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bannerClip)">
