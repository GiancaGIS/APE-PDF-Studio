        <path d="M314 76v54a20 20 0 0 0 20 20h54Z" fill="#d0e1f2"/>
        <path d="M174 318l70-140a13 13 0 0 1 24 0l-20 41-36 99Z" fill="#386ea8"/>
        <path d="M244 178a13 13 0 0 1 24 0l72 140h-39l-45-94Z" fill="url(#ascent)"/>
